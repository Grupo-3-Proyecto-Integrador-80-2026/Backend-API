services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/serviceAccountKey.json
    volumes:
      - ./credentials:/app/credentials:ro
    restart: unless-stopped
    networks:
      - salon-network

  frontend:
    build:
      context: ../Frontend-Collaborative-study-room-platform/frontend
      dockerfile: Dockerfile
      # Vite incrusta estas variables al construir; se leen del archivo .env de esta carpeta
      args:
        VITE_API_URL: http://localhost:3000
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    container_name: frontend-app
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - salon-network

networks:
  salon-network:
    driver: bridge
